; LilyGo T-Display-S3 AMOLED Plus -- weather display
;
; Build:   pio run
; Flash:   pio run -t upload
; Serial:  pio device monitor

[platformio]
default_envs = T-Display-AMOLED
boards_dir = boards
src_dir = WeatherDisplay                  ; needs include/secrets.h

[env:T-Display-AMOLED]
platform = espressif32@6.12.0
board = T-Display-AMOLED
framework = arduino
upload_speed = 921600
monitor_speed = 115200

monitor_filters =
    default
    esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DDISABLE_ALL_LIBRARY_WARNINGS

    ; Serial goes out the same native USB port used for flashing. Startup blocks
    ; waiting for a USB host, so swap this for -UARDUINO_USB_CDC_ON_BOOT if the
    ; board has to run on battery. See docs/flashing.md.
    -DARDUINO_USB_CDC_ON_BOOT=1

    -DCORE_DEBUG_LEVEL=1

lib_deps =
    ; 1.2.3 is the newest published version. The checkout at
    ; ~/dev/LilyGo-AMOLED-Series is 1.2.4, which LilyGo has not released to the
    ; registry — so read the sources there, but build against this.
    xinyuan-lilygo/LilyGo-AMOLED-Series @ ^1.2.3
    bodmer/TFT_eSPI @ 2.5.31
    bblanchon/ArduinoJson @ ^7.0.0
    FS
    SPIFFS
    SD

; LilyGo-AMOLED-Series pulls in lvgl 8.4.0, XPowersLib 0.2.7, SensorLib 0.2.4,
; AceButton, Adafruit NeoPixel and TinyGPSPlus as declared dependencies — see
; its library.json. Do not re-pin them here without a reason; SensorLib in
; particular breaks its API at 0.4.0 (docs/flashing.md).
